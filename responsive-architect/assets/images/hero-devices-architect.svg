<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="heroBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F2925"/>
      <stop offset="100%" stop-color="#1D1917"/>
    </linearGradient>
    
    <!-- Accent Blueprint Glow -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A0D4E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A47864" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Architectural Canvas Frame -->
  <rect width="800" height="520" rx="14" fill="url(#heroBgGrad)"/>

  <!-- Blueprint Grid Overlay Lines -->
  <g opacity="0.1" stroke="#A0D4E0" stroke-width="1">
    <path d="M 0,40 H 800 M 0,80 H 800 M 0,120 H 800 M 0,160 H 800 M 0,200 H 800 M 0,240 H 800 M 0,280 H 800 M 0,320 H 800 M 0,360 H 800 M 0,400 H 800 M 0,440 H 800 M 0,480 H 800" />
    <path d="M 40,0 V 520 M 80,0 V 520 M 120,0 V 520 M 160,0 V 520 M 200,0 V 520 M 240,0 V 520 M 280,0 V 520 M 320,0 V 520 M 360,0 V 520 M 400,0 V 520 M 440,0 V 520 M 480,0 V 520 M 520,0 V 520 M 560,0 V 520 M 600,0 V 520 M 640,0 V 520 M 680,0 V 520 M 720,0 V 520 M 760,0 V 520" />
  </g>

  <!-- Architectural Measurement Dimension Lines & Nodes -->
  <g opacity="0.4" stroke="#A0D4E0" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="80" y1="420" x2="260" y2="100" />
    <line x1="260" y1="100" x2="720" y2="100" />
    <line x1="720" y1="100" x2="540" y2="420" />
    <line x1="540" y1="420" x2="80" y2="420" />
  </g>

  <!-- DESKTOP MONITOR DEVICE -->
  <g filter="url(#dropShadow)">
    <!-- Monitor Outer Body -->
    <rect x="180" y="70" width="480" height="300" rx="12" fill="#F2F0EA" stroke="#A47864" stroke-width="4"/>
    <!-- Monitor Screen Bar -->
    <rect x="180" y="70" width="480" height="32" rx="12" fill="#E2DDD2"/>
    <rect x="180" y="90" width="480" height="12" fill="#E2DDD2"/>
    <!-- Window Control Dots -->
    <circle cx="204" cy="86" r="4" fill="#C85A54"/>
    <circle cx="218" cy="86" r="4" fill="#E6A15C"/>
    <circle cx="232" cy="86" r="4" fill="#5CA872"/>
    <rect x="254" y="80" width="200" height="12" rx="6" fill="#D3CCC0"/>

    <!-- Desktop Screen Web Layout UI -->
    <!-- Nav header -->
    <rect x="200" y="115" width="70" height="12" rx="3" fill="#2F2925"/>
    <rect x="520" y="117" width="35" height="8" rx="2" fill="#6F6964"/>
    <rect x="565" y="117" width="35" height="8" rx="2" fill="#6F6964"/>
    <rect x="610" y="115" width="35" height="12" rx="4" fill="#14535F"/>

    <!-- Hero Content UI wireframe -->
    <rect x="200" y="145" width="230" height="18" rx="4" fill="#2F2925"/>
    <rect x="200" y="171" width="190" height="8" rx="2" fill="#6F6964"/>
    <rect x="200" y="185" width="160" height="8" rx="2" fill="#6F6964"/>
    <rect x="200" y="205" width="90" height="22" rx="11" fill="#A47864"/>

    <!-- Hero Graphic Box on Desktop -->
    <rect x="450" y="145" width="195" height="105" rx="8" fill="#EBF7FA" stroke="#A0D4E0" stroke-width="2"/>
    <path d="M 470 230 L 515 180 L 555 210 L 600 165 L 630 230 Z" fill="#A0D4E0" opacity="0.7"/>
    <circle cx="585" cy="180" r="12" fill="#A47864" opacity="0.8"/>

    <!-- Desktop Grid Cards -->
    <rect x="200" y="260" width="135" height="95" rx="6" fill="#FFFFFF" stroke="#D6D0C4" stroke-width="1.5"/>
    <rect x="350" y="260" width="135" height="95" rx="6" fill="#FFFFFF" stroke="#D6D0C4" stroke-width="1.5"/>
    <rect x="500" y="260" width="145" height="95" rx="6" fill="#FFFFFF" stroke="#A0D4E0" stroke-width="2"/>

    <!-- Desktop Stand Base -->
    <path d="M 370 370 L 470 370 L 480 430 L 360 430 Z" fill="#D3CCC0"/>
    <rect x="320" y="430" width="200" height="12" rx="4" fill="#B8AF9F"/>
  </g>

  <!-- TABLET DEVICE OVERLAY -->
  <g filter="url(#dropShadow)">
    <rect x="70" y="200" width="190" height="270" rx="16" fill="#F2F0EA" stroke="#2F2925" stroke-width="4"/>
    <rect x="70" y="200" width="190" height="26" rx="16" fill="#E2DDD2"/>
    <rect x="70" y="216" width="190" height="10" fill="#E2DDD2"/>
    <circle cx="165" cy="213" r="3" fill="#6F6964"/>
    <!-- Tablet Screen Layout Wireframe -->
    <rect x="85" y="240" width="160" height="14" rx="3" fill="#2F2925"/>
    <rect x="85" y="262" width="160" height="45" rx="4" fill="#A0D4E0" opacity="0.5"/>
    <rect x="85" y="315" width="160" height="65" rx="4" fill="#FFFFFF" stroke="#D6D0C4"/>
    <rect x="85" y="388" width="160" height="65" rx="4" fill="#FFFFFF" stroke="#D6D0C4"/>
  </g>

  <!-- SMARTPHONE DEVICE OVERLAY -->
  <g filter="url(#dropShadow)">
    <rect x="620" y="230" width="120" height="240" rx="18" fill="#F2F0EA" stroke="#14535F" stroke-width="4"/>
    <rect x="660" y="238" width="40" height="6" rx="3" fill="#14535F"/>
    <!-- Smartphone Screen Layout Wireframe -->
    <rect x="632" y="256" width="96" height="12" rx="2" fill="#2F2925"/>
    <rect x="632" y="274" width="96" height="50" rx="4" fill="#A0D4E0"/>
    <rect x="632" y="330" width="96" height="60" rx="4" fill="#FFFFFF" stroke="#D6D0C4"/>
    <rect x="632" y="396" width="96" height="55" rx="4" fill="#FFFFFF" stroke="#D6D0C4"/>
  </g>

  <!-- Technical Blueprint Labels -->
  <g transform="translate(45, 45)">
    <rect width="130" height="30" rx="15" fill="#A0D4E0"/>
    <text x="65" y="19" font-family="monospace" font-size="11" font-weight="bold" fill="#14535F" text-anchor="middle">RESPONSIVE 1:1</text>
  </g>
  <g transform="translate(625, 40)">
    <rect width="130" height="30" rx="15" fill="#A47864"/>
    <text x="65" y="19" font-family="monospace" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MOBILE-FIRST</text>
  </g>
</svg>
