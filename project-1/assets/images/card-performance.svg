<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" rx="12" fill="#EAE7DF"/>
  <g transform="translate(40, 25)">
    <!-- Speedometer / Performance Graphic -->
    <rect x="0" y="0" width="320" height="190" rx="8" fill="#FFFFFF" stroke="#D3CCC0" stroke-width="2"/>
    
    <!-- Gauge arc -->
    <path d="M 60 140 A 100 100 0 0 1 260 140" fill="none" stroke="#E2DDD2" stroke-width="16" stroke-linecap="round"/>
    <path d="M 60 140 A 100 100 0 0 1 240 70" fill="none" stroke="#A0D4E0" stroke-width="16" stroke-linecap="round"/>
    <path d="M 240 70 A 100 100 0 0 1 260 140" fill="none" stroke="#14535F" stroke-width="16" stroke-linecap="round"/>

    <!-- Pointer -->
    <circle cx="160" cy="140" r="10" fill="#3B2820"/>
    <line x1="160" y1="140" x2="230" y2="75" stroke="#3B2820" stroke-width="4" stroke-linecap="round"/>

    <!-- Metric scores -->
    <rect x="115" y="150" width="90" height="28" rx="14" fill="#3B2820"/>
    <text x="160" y="169" font-family="sans-serif" font-size="13" font-weight="bold" fill="#A0D4E0" text-anchor="middle">100 / 100</text>
  </g>
</svg>
