<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" rx="12" fill="#EAE7DF"/>
  <g transform="translate(40, 30)">
    <!-- Craftsmanship Graphic: Compass & Ruler & Code -->
    <rect x="0" y="0" width="320" height="180" rx="8" fill="#3B2820"/>
    <circle cx="160" cy="90" r="60" fill="none" stroke="#A0D4E0" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="160" cy="90" r="40" fill="none" stroke="#F2F0EA" stroke-width="1.5"/>
    
    <!-- Ruler markings -->
    <line x1="160" y1="20" x2="160" y2="160" stroke="#8C6D58" stroke-width="1"/>
    <line x1="90" y1="90" x2="230" y2="90" stroke="#8C6D58" stroke-width="1"/>

    <!-- Compass needles -->
    <polygon points="160,45 167,90 160,135 153,90" fill="#A0D4E0"/>
    <circle cx="160" cy="90" r="6" fill="#14535F"/>

    <text x="160" y="165" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F2F0EA" text-anchor="middle">PRECISION &amp; ELEGANCE</text>
  </g>
</svg>
