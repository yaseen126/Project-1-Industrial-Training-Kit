<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" rx="12" fill="#EAE7DF"/>
  <g transform="translate(30, 20)">
    <!-- CSS Grid Diagram -->
    <rect x="0" y="0" width="340" height="200" rx="8" fill="#FFFFFF" stroke="#D3CCC0" stroke-width="2"/>
    
    <!-- Grid Cells -->
    <rect x="15" y="15" width="200" height="40" rx="4" fill="#3B2820"/>
    <text x="115" y="40" font-family="monospace" font-size="12" fill="#A0D4E0" text-anchor="middle">grid-area: header</text>

    <rect x="225" y="15" width="100" height="40" rx="4" fill="#5C4033"/>
    <text x="275" y="40" font-family="monospace" font-size="11" fill="#F2F0EA" text-anchor="middle">flex-nav</text>

    <rect x="15" y="65" width="200" height="80" rx="4" fill="#A0D4E0" opacity="0.8"/>
    <text x="115" y="105" font-family="monospace" font-size="12" font-weight="bold" fill="#14535F" text-anchor="middle">main content grid</text>

    <rect x="225" y="65" width="100" height="120" rx="4" fill="#14535F"/>
    <text x="275" y="130" font-family="monospace" font-size="11" fill="#A0D4E0" text-anchor="middle">sidebar</text>

    <rect x="15" y="155" width="200" height="30" rx="4" fill="#5C4033"/>
    <text x="115" y="175" font-family="monospace" font-size="11" fill="#F2F0EA" text-anchor="middle">footer</text>
  </g>
</svg>
