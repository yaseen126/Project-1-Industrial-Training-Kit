<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" rx="12" fill="#EAE7DF"/>
  <g transform="translate(30, 25)">
    <!-- Eye & Screen Accessibility Graphic -->
    <rect x="0" y="0" width="340" height="190" rx="8" fill="#FFFFFF" stroke="#D3CCC0" stroke-width="2"/>

    <!-- Focus Outline Box Demo -->
    <rect x="25" y="25" width="140" height="60" rx="6" fill="#F2F0EA" stroke="#14535F" stroke-width="3" stroke-dasharray="6 3"/>
    <text x="37" y="50" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14535F">:focus-visible</text>
    <text x="37" y="68" font-family="monospace" font-size="10" fill="#3B2820">outline: 3px solid</text>

    <!-- Contrast Badge -->
    <rect x="180" y="25" width="135" height="60" rx="6" fill="#3B2820"/>
    <text x="195" y="50" font-family="sans-serif" font-size="12" font-weight="bold" fill="#A0D4E0">WCAG AAA</text>
    <text x="195" y="68" font-family="sans-serif" font-size="11" fill="#F2F0EA">Contrast 7:1</text>

    <!-- Keyboard Navigation Row -->
    <rect x="25" y="105" width="290" height="60" rx="6" fill="#E8E3D8"/>
    <!-- Keys -->
    <rect x="40" y="118" width="40" height="34" rx="4" fill="#3B2820"/>
    <text x="60" y="140" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F2F0EA" text-anchor="middle">Tab</text>

    <text x="95" y="140" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3B2820">+</text>

    <rect x="110" y="118" width="50" height="34" rx="4" fill="#3B2820"/>
    <text x="135" y="140" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F2F0EA" text-anchor="middle">Enter</text>

    <text x="175" y="139" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14535F">Screen Reader Ready</text>
    <circle cx="290" cy="135" r="10" fill="#A0D4E0"/>
    <path d="M285 135 L288 138 L295 131" stroke="#14535F" stroke-width="2.5" fill="none"/>
  </g>
</svg>
