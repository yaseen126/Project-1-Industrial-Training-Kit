<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" rx="12" fill="#EAE7DF"/>
  <g transform="translate(40, 30)">
    <!-- Main screen -->
    <rect x="0" y="0" width="200" height="130" rx="8" fill="#FFFFFF" stroke="#3B2820" stroke-width="3"/>
    <rect x="0" y="0" width="200" height="18" fill="#3B2820"/>
    <circle cx="12" cy="9" r="3" fill="#A0D4E0"/>
    <circle cx="22" cy="9" r="3" fill="#E2DDD2"/>
    <circle cx="32" cy="9" r="3" fill="#E2DDD2"/>
    <rect x="15" y="30" width="90" height="12" rx="3" fill="#3B2820"/>
    <rect x="15" y="48" width="170" height="8" rx="2" fill="#8C6D58"/>
    <rect x="15" y="60" width="140" height="8" rx="2" fill="#8C6D58"/>
    <rect x="15" y="78" width="50" height="40" rx="4" fill="#A0D4E0"/>
    <rect x="75" y="78" width="50" height="40" rx="4" fill="#D3CCC0"/>
    <rect x="135" y="78" width="50" height="40" rx="4" fill="#D3CCC0"/>

    <!-- Tablet screen overlapping -->
    <rect x="170" y="40" width="95" height="125" rx="8" fill="#F8F6F0" stroke="#14535F" stroke-width="3"/>
    <rect x="180" y="52" width="75" height="8" rx="2" fill="#14535F"/>
    <rect x="180" y="66" width="75" height="30" rx="4" fill="#A0D4E0"/>
    <rect x="180" y="102" width="75" height="20" rx="3" fill="#8C6D58"/>

    <!-- Phone screen overlapping -->
    <rect x="230" y="80" width="60" height="95" rx="8" fill="#3B2820" stroke="#A0D4E0" stroke-width="3"/>
    <rect x="240" y="92" width="40" height="6" rx="2" fill="#A0D4E0"/>
    <rect x="240" y="104" width="40" height="22" rx="3" fill="#F2F0EA"/>
    <rect x="240" y="132" width="40" height="15" rx="2" fill="#A0D4E0" opacity="0.8"/>
  </g>
  <!-- Responsive Indicator Arrows -->
  <path d="M 50 190 H 350" stroke="#8C6D58" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="45,190 55,185 55,195" fill="#8C6D58"/>
  <polygon points="355,190 345,185 345,195" fill="#8C6D58"/>
  <text x="200" y="212" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3B2820" text-anchor="middle">320px ── 768px ── 1024px ── 1920px</text>
</svg>
