<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <rect width="400" height="240" rx="12" fill="#EAE7DF"/>
  <g transform="translate(30, 20)">
    <!-- Container Box -->
    <rect x="0" y="0" width="340" height="200" rx="8" fill="#3B2820"/>
    
    <!-- Tag Landmark <header> -->
    <rect x="15" y="15" width="310" height="35" rx="4" fill="#5C4033" stroke="#A0D4E0" stroke-width="1.5"/>
    <text x="30" y="37" font-family="monospace" font-size="13" font-weight="bold" fill="#A0D4E0">&lt;header&gt; &lt;nav&gt; ... &lt;/nav&gt; &lt;/header&gt;</text>
    
    <!-- Main Block -->
    <rect x="15" y="58" width="200" height="125" rx="4" fill="#251813" stroke="#A0D4E0" stroke-width="1.5"/>
    <text x="25" y="78" font-family="monospace" font-size="12" font-weight="bold" fill="#F2F0EA">&lt;main&gt;</text>

    <!-- Article Tag inside main -->
    <rect x="25" y="86" width="180" height="42" rx="3" fill="#3B2820"/>
    <text x="35" y="111" font-family="monospace" font-size="11" fill="#A0D4E0">&lt;article&gt; content &lt;/article&gt;</text>
    
    <rect x="25" y="134" width="180" height="42" rx="3" fill="#3B2820"/>
    <text x="35" y="159" font-family="monospace" font-size="11" fill="#A0D4E0">&lt;article&gt; content &lt;/article&gt;</text>
    
    <!-- Sidebar Landmark <aside> -->
    <rect x="225" y="58" width="100" height="80" rx="4" fill="#5C4033" stroke="#A0D4E0" stroke-width="1.5"/>
    <text x="235" y="80" font-family="monospace" font-size="12" font-weight="bold" fill="#A0D4E0">&lt;aside&gt;</text>
    <text x="235" y="105" font-family="sans-serif" font-size="10" fill="#EAE7DF">Landmark</text>

    <!-- Landmark <footer> -->
    <rect x="225" y="145" width="100" height="38" rx="4" fill="#14535F"/>
    <text x="235" y="168" font-family="monospace" font-size="11" font-weight="bold" fill="#A0D4E0">&lt;footer&gt;</text>
  </g>
</svg>
